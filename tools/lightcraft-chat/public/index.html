<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightCraft Chat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f3f0; --panel: #ffffff; --line: #dcd9d2; --text: #1d1c1a; --muted: #6d6a63;
    --accent: #b4571f; --accent-text: #ffffff; --user: #ece8df; --ok: #2f7d4f; --bad: #b3312b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #212125; --line: #34343a; --text: #ecebe7; --muted: #9a988f;
      --accent: #e08a4f; --accent-text: #1a1206; --user: #2c2c32; --ok: #6fc391; --bad: #ef8079;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .model { color: var(--muted); font-size: 13px; margin-right: auto; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); min-height: 0; }
  .chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; border-right: 1px solid var(--line); }
  #messages { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: 12px; }
  .msg.user img { display: block; max-width: 220px; max-height: 160px; border-radius: 8px; margin-bottom: 6px; }
  .msg.assistant:empty::before { content: "…"; color: var(--muted); }
  .msg.notice { color: var(--muted); font-size: 13px; }
  .msg.error { color: var(--bad); }
  .step { color: var(--muted); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 420px; }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; resize: none; min-height: 40px; max-height: 180px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #attachment { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  #attachment[hidden] { display: none; }
  #attachment button { padding: 0 6px; border: 0; }
  #talk { touch-action: none; user-select: none; -webkit-user-select: none; }
  #talk.listening { background: var(--bad); color: #fff; border-color: transparent; }
  #talk.transcribing { color: var(--muted); }
  aside { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  #preview { width: 100%; max-height: 42vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: block; }
  #preview[hidden] + p { display: block; }
  #no-preview { display: none; color: var(--muted); font-size: 13px; margin: 0; }
  #log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #log:empty::before { content: "Tool calls will be listed here as they run."; color: var(--muted); font-size: 13px; }
  #log li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #log summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  #log .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  #log .name { font-weight: 600; }
  #log .state { margin-left: auto; color: var(--muted); }
  #log li.ok .state { color: var(--ok); }
  #log li.bad .state { color: var(--bad); }
  #log pre { margin: 6px 0 0; font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; }
  #log img { max-width: 100%; border-radius: 6px; margin-top: 6px; display: block; }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; }
    .chat { border-right: 0; min-height: 70vh; }
    aside { border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>LightCraft Chat</h1>
  <span class="model" id="model"></span>
  <button id="reset" type="button" title="Clear the conversation and restart LightCraft">Reset</button>
</header>
<main>
  <section class="chat">
    <div id="messages">
      <p class="empty" id="empty">Ask for an edit, such as “look at the active photo and warm it up a little”, or attach a picture of your own. To speak instead, hold the right Option key, talk, and let go; it works from LightCraft too.</p>
    </div>
    <form id="form">
      <div id="attachment" hidden><span id="attachment-name"></span><button type="button" id="detach" aria-label="Remove attachment">✕</button></div>
      <div class="row">
        <button type="button" id="attach">Attach photo</button>
        <input type="file" id="file" accept="image/*,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2" hidden>
        <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
        <button type="button" id="talk" title="Hold this button, or the right Option key, and speak. Let go to send.">Hold to talk</button>
        <button type="submit" class="primary" id="send">Send</button>
      </div>
    </form>
  </section>
  <aside>
    <section>
      <h2>Current photo</h2>
      <img id="preview" alt="The active photo as LightCraft renders it now" hidden>
      <p id="no-preview">No active photo.</p>
    </section>
    <section>
      <h2>Action log</h2>
      <ol id="log"></ol>
    </section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages"), logEl = $("log"), inputEl = $("input"), sendEl = $("send");
let attachment = null;      // File
let controller = null;      // AbortController while a reply streams
const logItems = new Map(); // tool call id -> <li>

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMessage(kind, text) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.textContent = text ?? "";
  messagesEl.append(el);
  scrollDown();
  return el;
}

function showPreview(image) {
  const img = $("preview");
  if (image) img.src = `data:${image.mimeType};base64,${image.data}`;
  img.hidden = !image;
}

function setBusy(busy) {
  sendEl.textContent = busy ? "Stop" : "Send";
  $("reset").disabled = busy;
  $("attach").disabled = busy;
}

function setAttachment(file) {
  attachment = file;
  $("attachment").hidden = !file;
  $("attachment-name").textContent = file ? `Attached: ${file.name}` : "";
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] ?? "");
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function logCall(event) {
  const li = document.createElement("li");
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  for (const [cls, text] of [["n", `${logItems.size + 1}.`], ["name", event.name], ["state", "running"]]) {
    const span = document.createElement("span");
    span.className = cls;
    span.textContent = text;
    summary.append(span);
  }
  const args = document.createElement("pre");
  args.textContent = JSON.stringify(event.input, null, 2);
  details.append(summary, args);
  li.append(details);
  logEl.append(li);
  logItems.set(event.id, li);
  li.scrollIntoView({ block: "nearest" });
}

function logResult(event) {
  const li = logItems.get(event.id);
  if (!li) return;
  li.className = event.isError ? "bad" : "ok";
  li.querySelector(".state").textContent = event.isError ? "failed" : "done";
  const details = li.querySelector("details");
  if (event.text) {
    const out = document.createElement("pre");
    out.textContent = event.text.length > 4000 ? `${event.text.slice(0, 4000)}\n…` : event.text;
    details.append(out);
  }
  for (const image of event.images) {
    const img = document.createElement("img");
    img.src = `data:${image.mimeType};base64,${image.data}`;
    img.alt = "Image returned by the tool";
    details.append(img);
  }
  if (event.isError) details.open = true;
}

// --- Voice: hold the right Option key (or the Talk button), speak, let go. ---
// Speech is transcribed by the local server and the reply is read by the system voice.
const TALK_KEY = "AltRight";
const MIN_HOLD_MS = 300; // a shorter press is a slip, not a sentence
const talkEl = $("talk");
const canSpeak = "speechSynthesis" in window;
let micStream = null;  // kept open after the first use, so later presses don't clip the first word
let recorder = null, recorded = [], talkStart = 0, talking = false;
let unspoken = "";     // reply text not yet handed to the speech queue

function setTalk(state) {
  talkEl.className = state;
  talkEl.textContent = { listening: "Listening…", transcribing: "Transcribing…" }[state] ?? "Hold to talk";
}

function stopSpeaking() {
  unspoken = "";
  if (canSpeak) speechSynthesis.cancel();
}

/** Queues the finished sentences of the streamed reply; `all` also queues the unfinished rest. */
function speak(delta, all = false) {
  if (!canSpeak) return;
  unspoken += delta;
  let cut = all ? unspoken.length : 0;
  if (!all) for (const match of unspoken.matchAll(/[.!?:]\s|\n/g)) cut = match.index + match[0].length;
  const ready = unspoken.slice(0, cut).trim();
  unspoken = unspoken.slice(cut);
  if (!/[\p{L}\p{N}]/u.test(ready)) return;
  const utterance = new SpeechSynthesisUtterance(ready);
  utterance.rate = 1.05;
  speechSynthesis.speak(utterance);
}

/** The recording as 16 kHz mono 16-bit WAV, which is what Whisper reads. */
async function toWav(blob) {
  const context = new AudioContext();
  try {
    const decoded = await context.decodeAudioData(await blob.arrayBuffer());
    const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * 16000)), 16000);
    const source = offline.createBufferSource();
    source.buffer = decoded;
    source.connect(offline.destination);
    source.start();
    const samples = (await offline.startRendering()).getChannelData(0);
    const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
    const ascii = (at, text) => [...text].forEach((ch, i) => view.setUint8(at + i, ch.charCodeAt(0)));
    ascii(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); ascii(8, "WAVEfmt ");
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, 16000, true); view.setUint32(28, 32000, true); view.setUint16(32, 2, true);
    view.setUint16(34, 16, true); ascii(36, "data"); view.setUint32(40, samples.length * 2, true);
    samples.forEach((sample, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sample)) * 32767, true));
    return new Blob([view], { type: "audio/wav" });
  } finally {
    context.close();
  }
}

async function startTalking() {
  if (talking) return;
  talking = true;
  stopSpeaking();                       // talking over the reply interrupts it,
  if (controller) controller.abort();   // and stops the work behind it
  try {
    micStream ??= await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
  } catch {
    talking = false;
    addMessage("error", "No microphone: allow microphone access for this page in the browser, then try again.");
    return;
  }
  if (!talking) return; // let go while the permission prompt was up
  recorded = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = (event) => { if (event.data.size > 0) recorded.push(event.data); };
  recorder.start();
  talkStart = performance.now();
  setTalk("listening");
}

/** Ends the recording and sends what was said; `discard` drops it instead. */
async function stopTalking(discard = false) {
  if (!talking) return;
  talking = false;
  const used = recorder;
  recorder = null;
  if (!used) return;
  await new Promise((resolve) => { used.onstop = resolve; used.stop(); });
  if (discard || performance.now() - talkStart < MIN_HOLD_MS) return setTalk("");
  setTalk("transcribing");
  try {
    const response = await fetch("/api/transcribe", {
      method: "POST",
      headers: { "content-type": "audio/wav" },
      body: await toWav(new Blob(recorded, { type: used.mimeType })),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error ?? `HTTP ${response.status}`);
    setTalk("");
    if (result.text) await send(result.text);
    else addMessage("notice", "Didn't catch that. Hold the key a moment before you start speaking.");
  } catch (error) {
    addMessage("error", `Voice: ${error.message}`);
  } finally {
    if (!talking) setTalk("");
  }
}

/** Sends the text box, or `spoken` (a transcript) when given; a spoken message is answered aloud. */
async function send(spoken) {
  const voice = typeof spoken === "string";
  const text = voice ? spoken : inputEl.value.trim();
  const file = attachment;
  if (!text && !file) return;

  const userEl = addMessage("user", text);
  if (file) {
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    img.alt = file.name;
    img.onerror = () => img.replaceWith(`[${file.name}]\n`); // raw files the browser can't show
    userEl.prepend(img);
  }
  if (!voice) { // a spoken message leaves a typed draft alone
    inputEl.value = "";
    inputEl.style.height = "";
  }
  setAttachment(null);
  setBusy(true);
  const mine = (controller = new AbortController());
  unspoken = "";
  let replyEl = addMessage("assistant");

  try {
    const body = JSON.stringify({ text, voice, image: file ? { name: file.name, data: await toBase64(file) } : undefined });
    let response;
    for (let tries = 0; ; tries++) {
      response = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body,
        signal: mine.signal,
      });
      // A reply that was just interrupted may still be finishing a tool call: wait for it (up to 15 s).
      if (response.status !== 409 || tries >= 50) break;
      await new Promise((resolve) => setTimeout(resolve, 300));
    }
    if (!response.ok) throw new Error((await response.json()).error ?? `HTTP ${response.status}`);

    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        if (!frame.startsWith("data: ")) continue;
        const event = JSON.parse(frame.slice(6));
        if (event.type === "text") {
          replyEl.textContent += event.delta;
          if (voice) speak(event.delta);
          scrollDown();
        } else if (event.type === "tool_call") {
          if (voice) speak("", true);
          logCall(event);
          addMessage("step", `→ ${event.name}`);
          replyEl = addMessage("assistant"); // text after the tool call starts a new bubble
        } else if (event.type === "tool_result") {
          logResult(event);
        } else if (event.type === "preview") {
          showPreview(event.image);
        } else if (event.type === "notice") {
          addMessage("notice", event.text);
        } else if (event.type === "error") {
          addMessage("error", event.message);
        }
      }
    }
    if (voice) speak("", true);
  } catch (error) {
    addMessage(error.name === "AbortError" ? "notice" : "error", error.name === "AbortError" ? "Stopped." : error.message);
    if (voice && controller === mine) stopSpeaking();
  } finally {
    for (const el of messagesEl.querySelectorAll(".msg.assistant:empty")) el.remove();
    if (controller === mine) { // not when a newer message has already taken over
      controller = null;
      setBusy(false);
      inputEl.focus();
    }
  }
}

if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
  window.addEventListener("keydown", (event) => {
    if (event.code === "Escape") stopSpeaking();
    if (event.code !== TALK_KEY || event.repeat) return;
    event.preventDefault();
    startTalking();
  });
  window.addEventListener("keyup", (event) => { if (event.code === TALK_KEY) stopTalking(); });
  window.addEventListener("blur", () => stopTalking(true)); // the key's release would be missed
  talkEl.addEventListener("pointerdown", (event) => { talkEl.setPointerCapture(event.pointerId); startTalking(); });
  talkEl.addEventListener("pointerup", () => stopTalking());
  talkEl.addEventListener("pointercancel", () => stopTalking(true));
  // The server passes on the right Option key held in another app (see "Voice" in the README).
  new EventSource("/api/events").onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type === "talk") event.down ? startTalking() : stopTalking();
  };
} else {
  talkEl.hidden = true;
}

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  stopSpeaking();
  if (controller) controller.abort();
  else send();
});
inputEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    if (!controller) send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "";
  inputEl.style.height = `${Math.min(inputEl.scrollHeight + 2, 180)}px`;
});
$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (event) => {
  setAttachment(event.target.files[0] ?? null);
  event.target.value = "";
});
$("detach").addEventListener("click", () => setAttachment(null));
$("reset").addEventListener("click", async () => {
  $("reset").disabled = true;
  try {
    const response = await fetch("/api/reset", { method: "POST" });
    const state = await response.json();
    if (!response.ok) throw new Error(state.error);
    messagesEl.replaceChildren();
    logEl.replaceChildren();
    logItems.clear();
    showPreview(state.preview);
  } catch (error) {
    addMessage("error", error.message);
  } finally {
    $("reset").disabled = false;
  }
});

fetch("/api/state").then((r) => r.json()).then((state) => {
  $("model").textContent = `${state.model} · ${state.tools.length} LightCraft tools`;
  showPreview(state.preview);
});
</script>
</body>
</html>
